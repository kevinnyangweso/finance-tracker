<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Finance Tracker'">Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-brand-600">
                💰 Finance Tracker
            </a>
            <nav class="flex items-center gap-4">
                <a th:href="@{/}" class="text-slate-600 hover:text-brand-600 transition">
                    Home
                </a>
                <a th:href="@{/login}" class="text-slate-600 hover:text-brand-600 transition">
                    Login
                </a>
                <a th:href="@{/register}"
                   class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg transition">
                    Sign Up
                </a>
            </nav>
        </div>
    </header>

    <!-- Main content (overridden by child templates) -->
    <main class="flex-1">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12">
        <div class="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
            © 2026 Finance Tracker. Built with Spring Boot.
        </div>
    </footer>

</body>
</html>
