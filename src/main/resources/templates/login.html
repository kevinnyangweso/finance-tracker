<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Login - Finance Tracker')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">

            <h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome back</h1>
            <p class="text-slate-600 mb-6">Log in to your Finance Tracker account.</p>

            <!-- Success message (e.g., after registration) -->
            <div th:if="${success}"
                 class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4"
                 th:text="${success}"></div>

            <!-- Error message -->
            <div th:if="${error}"
                 class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"
                 th:text="${error}"></div>

            <!-- Login form -->
            <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
                        Username
                    </label>
                    <input type="text" id="username" th:field="*{username}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
                           placeholder="kevin">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
                        Password
                    </label>
                    <input type="password" id="password" th:field="*{password}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
                           placeholder="Your password">
                </div>

                <button type="submit"
                        class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-lg font-semibold transition">
                    Log In
                </button>
            </form>

            <p class="text-center text-sm text-slate-600 mt-6">
                Don't have an account?
                <a th:href="@{/register}" class="text-brand-600 hover:underline font-medium">Sign up</a>
            </p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
