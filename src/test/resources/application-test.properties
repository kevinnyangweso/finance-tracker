# Test Configuration — used by @SpringBootTest tests

# Random port so tests don't collide with the running dev app
server.port=0

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — create schema on startup, drop on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (test secret — at least 32 chars)
app.jwt.secret=TestSecretKeyForJWTThatIsAtLeast32CharactersLong12345
app.jwt.expiration=86400000

# Quieter logs during tests
logging.level.org.springframework=WARN
logging.level.com.financetracker=INFO